<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agent 365 PoC Trainer</title>
<link rel="stylesheet" href="src/styles.css?v=a123d733b1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230071e3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/><path d='m9 12 2 2 4-4'/></svg>">

<body>

<header class="appbar">
  <div class="appbar-left">
    <button class="icon-btn" id="btnMenu" aria-label="Lessons"></button>
    <nav class="ctx" id="ctx" aria-label="現在の位置"></nav>
  </div>
  <div class="appbar-right">
    <div class="hdr-progress" id="hdrProgress" hidden></div>
    <div class="score-pill" id="scorePill"><span id="scoreVal">0</span></div>
    <button class="ghost-btn" id="btnDash"></button>
    <div class="seg" id="langSeg" role="group" aria-label="Language">
      <button class="seg-btn" data-lang="ja">日本語</button>
      <button class="seg-btn" data-lang="en">EN</button>
    </div>
    <button class="icon-btn" id="btnTheme" aria-label="Appearance"></button>
    <button class="icon-btn" id="btnReset" aria-label="Reset"></button>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Lessons"></nav>
  <main class="main" id="main"></main>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <span id="modalTitle"></span>
      <button class="icon-btn" id="modalClose" aria-label="Close"></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
